<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando números</title>
</head>

<body>
    <style>
        body{
            font: normal 18pt Arial;
        }
        input{
            font: normal 18pt Arial;
            width: 100px;
        }
        div#res {
            margin-top: 20px;
        }
    </style>

    <h1>Somando números</h1>
    <input type="number" name="n1" id="n1">
    <input type="number" name="n2" id="n2">
    <input type="button" value="somar" onchange="somar ()">
    <div id="res">Resultado</div>

    <script>
        function somar(){
          var tn1 = window.document.getElementById('n1')
          var tn2 = window.document.getElementById('input#n')
          var res = window.document.getElementById('res')

          var valor1 = Number(tn1.value)
          var valor2 = Number(tn2.value)

          var s = valor1 + valor2;

          res.innerHTML = `a soma entre o valor ${valor1} e ${valor2} e igual a ${s}`;
        }  

    </script>
 

</body>

</html>
